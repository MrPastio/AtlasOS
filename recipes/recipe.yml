# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# AtlasOS для AMD / Intel видеокарт (и для виртуалки).
# Образ публикуется как ghcr.io/<владелец>/atlasos
name: atlasos # рабочее имя, финальное название выберем на этапе 5
description: "AtlasOS — macOS-like desktop on Bazzite KDE"

base-image: ghcr.io/ublue-os/bazzite # Bazzite KDE (Plasma 6)
image-version: stable

# Своя декорация окон собирается отдельной стадией на том же базовом образе,
# чтобы заголовки KDecoration совпадали с KWin; в образ копируется только плагин (common.yml).
stages:
  - name: atlas-decoration
    from: ghcr.io/ublue-os/bazzite:stable
    modules:
      - type: files
        files:
          - source: src/atlas-decoration
            destination: /tmp/atlas-decoration
      - type: script
        snippets:
          - bash /tmp/atlas-decoration/build.sh

  - name: atlas-welcome
    from: ghcr.io/ublue-os/bazzite:stable
    modules:
      - type: files
        files:
          - source: src/atlas-welcome
            destination: /tmp/atlas-welcome
      - type: script
        snippets:
          - bash /tmp/atlas-welcome/build.sh

modules:
  - from-file: common.yml
