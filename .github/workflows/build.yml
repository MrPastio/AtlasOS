name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # каждый день, после свежих образов Bazzite
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch: # кнопка «Run workflow» для ручной сборки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml        # AMD / Intel / виртуалка
          - recipe-nvidia.yml # NVIDIA
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
