# Экран входа (Plasma Login Manager) по «Атласу»: те же обои «Меридиан», что на столе и на
# экране блокировки. Читается после /usr/lib/plasmalogin/defaults.conf Fedora и перекрывает
# его фон default.jxl; настройки из «Параметров системы» пишутся в /etc и перекрывают этот файл.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Meridian/
PreviewImage=file:///usr/share/wallpapers/Meridian/contents/images/2560x1600.webp
