<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Шрифты «Атласа» по умолчанию: Onest — интерфейс, JetBrains Mono — моно.
     Номер 52: после пользовательских настроек (50-user), но раньше Noto (56/57). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Onest</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Onest</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
